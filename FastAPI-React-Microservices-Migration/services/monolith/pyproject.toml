[project]
name = "monolith"
version = "0.1.0"
description = "Monolithic version of the sum/mul service: computes in-process, no network calls"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "ms-lab-common",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
