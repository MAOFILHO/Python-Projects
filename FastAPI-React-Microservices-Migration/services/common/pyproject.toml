[project]
name = "ms-lab-common"
version = "0.1.0"
description = "Shared models/utilities for microservices-lab services"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["common*"]
